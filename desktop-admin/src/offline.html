<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Droelma Admin</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f4f1;
    color: #292524;
  }
  .card {
    text-align: center;
    max-width: 360px;
    padding: 32px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #78716c; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
  button {
    background: #0b5ea8;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #094a85; }
</style>
</head>
<body>
  <div class="card">
    <h1>Can't reach the admin dashboard</h1>
    <p>Check your internet connection, then try again.</p>
    <button onclick="location.href='https://dttbhutan.vercel.app/admin'">Retry</button>
  </div>
</body>
</html>
